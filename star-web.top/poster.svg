<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0a1a10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#10b981" stroke-width="0.5">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
  </g>
  <!-- Title -->
  <text x="600" y="260" text-anchor="middle" font-family="monospace, 'Courier New'" font-size="72" font-weight="bold" fill="white" letter-spacing="8">StarMC</text>
  <text x="600" y="340" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#71717a">纯净生存服务器 · star-mc.top</text>
  <!-- Accent bar -->
  <rect x="500" y="380" width="200" height="3" rx="1.5" fill="url(#accent)"/>
  <!-- Version -->
  <text x="600" y="430" text-anchor="middle" font-family="monospace" font-size="16" fill="#3f3f46">1.21.x Vanilla Survival</text>
</svg>
