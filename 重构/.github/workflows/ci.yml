name: frontend-ci

on:
  push:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Forbidden strings check
        run: npm run check:forbidden-strings

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Security baseline check
        run: npm run check:security-baseline

      - name: Performance budget check
        run: npm run check:perf-budget

      - name: Build
        run: npm run build

      - name: Critical E2E
        run: npm run test:e2e:critical

      - name: A11y baseline E2E
        run: npm run test:e2e:a11y

      - name: Summary
        if: always()
        run: |
          echo "## frontend verify" >> "$GITHUB_STEP_SUMMARY"
          echo "- checks: forbidden strings, lint, unit, security baseline, perf budget, build" >> "$GITHUB_STEP_SUMMARY"
          echo "- e2e: critical + a11y baseline" >> "$GITHUB_STEP_SUMMARY"
