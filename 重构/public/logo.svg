<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0055ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" fill="transparent"/>
  
  <g filter="url(#glow)">
    <circle cx="100" cy="100" r="80" fill="url(#logoGradient)" opacity="0.2"/>
    <circle cx="100" cy="100" r="70" fill="url(#logoGradient)" opacity="0.4"/>
    <circle cx="100" cy="100" r="60" fill="url(#logoGradient)" opacity="0.6"/>
    <circle cx="100" cy="100" r="50" fill="url(#logoGradient)" opacity="0.8"/>
  </g>
  
  <g fill="#ffffff" opacity="0.9">
    <rect x="85" y="70" width="30" height="30" rx="5"/>
    <rect x="85" y="105" width="30" height="30" rx="5"/>
    <rect x="50" y="70" width="30" height="30" rx="5"/>
    <rect x="50" y="105" width="30" height="30" rx="5"/>
    <rect x="120" y="70" width="30" height="30" rx="5"/>
    <rect x="120" y="105" width="30" height="30" rx="5"/>
  </g>
  
  <text x="100" y="175" text-anchor="middle" fill="#00d4ff" font-family="Arial, sans-serif" font-size="24" font-weight="bold" filter="url(#glow)">
    StarMC
  </text>
</svg>
