# 须由主配置 http { } 内 include。路径为服务器绝对路径，请按环境修改（宝塔等面板可改回 /www/wwwroot/...）。
# 上游默认本机端口；若服务在其它机器，只改各 upstream 的 server 即可，勿在 location 里散写公网 IP。
upstream starmc_upstream_dashboard { server 127.0.0.1:35417; }
upstream starmc_upstream_map_survival { server 127.0.0.1:41644; }
upstream starmc_upstream_map_nation { server 127.0.0.1:49299; }
upstream starmc_upstream_map_mod { server 127.0.0.1:43219; }

limit_req_zone $binary_remote_addr zone=starmc_static:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=starmc_proxy:10m rate=10r/s;

server { 
    listen 80; 
    server_name star-web.top www.star-web.top; 
    
    # HTTP自动跳转HTTPS
    location ^~ /.well-known/acme-challenge/ { 
        root /var/www/starmc; 
        allow all; 
    } 
    return 301 https://$host$request_uri; 
} 

server { 
    listen 443 ssl; 
    http2 on; 
    server_name star-web.top www.star-web.top; 

    # 网站根目录（与构建产物部署目录一致）
    root /var/www/starmc; 
    index index.html;  

    charset utf-8; 

    # SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    ssl_certificate /etc/nginx/ssl/starmc/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/starmc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:RSA+AES128:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 497 https://$host$request_uri;
    # SSL-END 

    client_max_body_size 16m;

    # 安全头；地图和仪表盘经同源 /proxy/* 反代，避免生产默认全域放行。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.mcsrvstat.us https://api.mcstatus.io https://api.allorigins.win https://api.rss2json.com https://v1.hitokoto.cn; frame-src 'self' https://player.bilibili.com https://live.bilibili.com; media-src 'self' data: blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; worker-src 'self' blob:; manifest-src 'self';" always;

    # Vue SPA 路由支持
    location / { 
        limit_req zone=starmc_static burst=80 nodelay;
        try_files $uri $uri/ /index.html; 
    } 

    # PWA 更新可靠性：SW 与注册脚本禁止 immutable 长缓存
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* ^/(registerSW|workbox-).+\.js$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ { 
        expires 7d; 
        access_log off; 
        add_header Cache-Control "public, immutable"; 
    } 
    
    # ======================================================================
    # 反向代理配置 (修复混合内容和跨域问题)
    # 使用 ^~ 确保优先级高于静态资源正则匹配
    # ======================================================================

    # ----------------------------------------------------------------------
    # 仪表盘相关代理 (Dashboard + API + WebSocket)
    # ----------------------------------------------------------------------

    # 1. 仪表盘主页面
    location ^~ /proxy/dashboard/ {
        limit_req zone=starmc_proxy burst=40 nodelay;
        proxy_pass http://starmc_upstream_dashboard/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        
        # 禁用上游压缩，确保 sub_filter 生效
        proxy_set_header Accept-Encoding "";

        # 核心修复：重写仪表盘源码中的硬编码 URL
        # 使用前缀匹配 + 注释掉后续内容的方法，避免 Nginx 配置文件中 $ 符号的变量展开问题
        
        # 1. 将 API_BASE 改为相对路径
        # 原文: const API_BASE = `http://${location.host}`;
        sub_filter 'const API_BASE = `http://' 'const API_BASE = ""; //';
        
        # 2. 将 WS_URL 改为自动适配 HTTPS/WSS
        # 原文: const WS_URL = `ws://${location.host}/ws`;
        sub_filter 'const WS_URL = `ws://' 'const WS_URL = ((location.protocol==="https:")?"wss://":"ws://") + location.host + "/ws"; //';
        
        sub_filter_once on;
        sub_filter_types text/html;
    }

    # 2. 仪表盘 API 接口 (解决 /api/system 404 问题)
    location /api/ {
        limit_req zone=starmc_proxy burst=40 nodelay;
        proxy_pass http://starmc_upstream_dashboard/api/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header X-Frame-Options;
    }

    # 3. 仪表盘 WebSocket (解决 /ws 连接失败问题)
    location /ws {
        limit_req zone=starmc_proxy burst=40 nodelay;
        proxy_pass http://starmc_upstream_dashboard/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ----------------------------------------------------------------------
    # 地图相关代理
    # ----------------------------------------------------------------------

    # 代理生存服地图
    location ^~ /proxy/map/survival/ {
        limit_req zone=starmc_proxy burst=60 nodelay;
        proxy_pass http://starmc_upstream_map_survival/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Accept-Encoding "";
        
        # 支持 WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 尝试修复绝对路径引用 (如果有)
        sub_filter 'src="/' 'src="/proxy/map/survival/';
        sub_filter 'href="/' 'href="/proxy/map/survival/';
        sub_filter_once off;
    }

    # 代理国战服地图
    location ^~ /proxy/map/nationWar/ {
        limit_req zone=starmc_proxy burst=60 nodelay;
        proxy_pass http://starmc_upstream_map_nation/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Accept-Encoding "";
        
        # 支持 WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        sub_filter 'src="/' 'src="/proxy/map/nationWar/';
        sub_filter 'href="/' 'href="/proxy/map/nationWar/';
        sub_filter_once off;
    }

    # 代理模组服地图
    location ^~ /proxy/map/modSurvival/ {
        limit_req zone=starmc_proxy burst=60 nodelay;
        proxy_pass http://starmc_upstream_map_mod/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        proxy_set_header Accept-Encoding "";
        
        # 支持 WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        sub_filter 'src="/' 'src="/proxy/map/modSurvival/';
        sub_filter 'href="/' 'href="/proxy/map/modSurvival/';
        sub_filter_once off;
    }

    # 日志 
    access_log /var/log/nginx/starmc-access.log; 
    error_log /var/log/nginx/starmc-error.log; 
} 
