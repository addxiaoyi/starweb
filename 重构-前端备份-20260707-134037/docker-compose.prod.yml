# 生产编排骨架：镜像需自行 build / 导入；密钥与数据库勿写进仓库，用 env_file 或编排密钥注入。
# 网站登录：当前后端以 SuperTokens 为主（见 backend/.env.example）；以下为需注入的变量提示，非默认值。
services:
  backend:
    image: starmc-backend:offline
    container_name: starmc-backend-prod
    # 建议：复制 backend/.env.example 为 backend/.env.production 并填写密钥后：
    # env_file:
    #   - ./backend/.env.production
    environment:
      NODE_ENV: production
      PORT: 8787
      PLUGIN_PORT: 8788
      # 浏览器访问的前端源，逗号分隔，须含 https://你的域名
      CORS_ORIGIN: ${CORS_ORIGIN:-https://example.com}
      # SuperTokens：SUPERTOKENS_CONNECTION_URI、AUTH_API_DOMAIN、AUTH_WEBSITE_DOMAIN 等见 backend/.env.example
      # 插件对接：AUTHX_PLUGIN_ADAPTER、AUTHX_PLUGIN_BASE、AUTHX_VLA_API_KEY、AUTHX_VLA_WEBHOOK_SECRET(S) 等
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      - starmc_backend_data:/app/data
    ports:
      - "8787:8787"
      - "8788:8788"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('https://www.star-web.top/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    image: starmc-web:offline
    container_name: starmc-web-prod
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  starmc_backend_data:
