limit_req_zone $binary_remote_addr zone=starmc_static:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=starmc_api:10m rate=10r/s;

server {
  listen 80;
  server_name _;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.mcsrvstat.us https://api.mcstatus.io https://api.allorigins.win https://api.rss2json.com https://v1.hitokoto.cn; frame-src 'self' https://player.bilibili.com https://live.bilibili.com; media-src 'self' data: blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; worker-src 'self' blob:; manifest-src 'self';" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  client_max_body_size 16m;

  root /usr/share/nginx/html;
  index index.html;

  # SPA 路由
  location / {
    limit_req zone=starmc_static burst=80 nodelay;
    try_files $uri $uri/ /index.html;
  }

  # 后端 API 代理
  location /api/ {
    limit_req zone=starmc_api burst=40 nodelay;
    proxy_pass http://backend:8787/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth/ {
    limit_req zone=starmc_api burst=40 nodelay;
    proxy_pass http://backend:8787/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    limit_req zone=starmc_api burst=80 nodelay;
    proxy_pass http://backend:8787/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz {
    proxy_pass http://backend:8787/healthz;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 插件桩服务
  location /plugin/ {
    limit_req zone=starmc_api burst=20 nodelay;
    proxy_pass http://backend:8788/plugin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
