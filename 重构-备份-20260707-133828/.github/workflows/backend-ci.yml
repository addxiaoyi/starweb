name: backend-ci

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.filter.outputs.modules }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            modules:
              - 'backend/src/modules/**'
              - 'backend/tests/*module*.test.js'

  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Summary
        if: always()
        run: |
          echo "## verify" >> "$GITHUB_STEP_SUMMARY"
          echo "- command: \\`npm test\\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- status: completed" >> "$GITHUB_STEP_SUMMARY"

  modules-smoke:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.modules == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Module smoke tests
        run: npm run test:modules

      - name: Summary
        if: always()
        run: |
          echo "## modules-smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "- command: \`npm run test:modules\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- status: completed" >> "$GITHUB_STEP_SUMMARY"

  lint-strict:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint strict (warning budget = 0)
        run: npm run lint:strict

      - name: Summary
        if: always()
        run: |
          echo "## lint-strict" >> "$GITHUB_STEP_SUMMARY"
          echo "- command: \`npm run lint:strict\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- status: completed" >> "$GITHUB_STEP_SUMMARY"
